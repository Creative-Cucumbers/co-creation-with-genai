</style></head><body><main class="canvas" aria-label="第5回 講義スライド"><div class="course" id="course"></div><div class="counter" role="status" aria-live="polite"><span id="page">1</span> / <span id="total">47</span></div><div id="slides"></div><footer>プログラミング演習｜第5回 · <a href="readme.md">詳しい授業資料</a></footer><nav aria-label="スライド操作"><button id="toc">目次</button><button id="prev">◀ 前へ</button><button id="next">次へ ▶</button></nav><div class="progress"></div></main><script>const sourceSlides=[{"title": "作れるWebアプリの幅を広げよう！", "chapter": 0, "kind": "cover", "cards": ["<div class=\"card \"><h3>入力・表現・データ</h3><p>何を受け取る？<br>どう反応する？ どう見せる？<br>どんな情報を使う？</p><p>2026年10月23日｜第5回<br>プログラミング演習</p></div>", "<div class=\"card image-card\"><figure><img src=\"images/a.png\" alt=\"Webアプリの画面やクラウド、操作をイメージしたイラスト\"><figcaption>既存の授業資料に収録された生成AIによるイラスト</figcaption></figure></div>"]}, {"title": "全7回の授業スケジュール", "chapter": 0, "kind": "normal", "cards": ["<div class=\"card table-card\"><table><tr><th>回数・日程</th><th>テーマ</th><th>担当講師</th></tr><tr><td>1 (9/25)</td><td>AI 基礎</td><td>伊藤、髙田</td></tr><tr><td>2 (10/2)</td><td>プロンプトエンジニアリング</td><td>髙田</td></tr><tr><td>3 (10/9)</td><td>AI の活用と倫理</td><td>伊藤</td></tr><tr><td>4 (10/16)</td><td>AI を活用したアプリ生成 ①</td><td>伊藤</td></tr><tr><td><strong>5 (10/23)</strong></td><td><strong>AI を活用したアプリ生成 ②</strong></td><td><strong>髙田</strong></td></tr><tr><td>6 (11/6)</td><td>総合演習</td><td>髙田、伊藤</td></tr><tr><td>7 (11/13)</td><td>総合演習</td><td>伊藤、髙田</td></tr></table></div>"]}, {"title": "1. 復習と今日のゴール（23分）", "chapter": 1, "kind": "divider", "cards": []}, {"title": "今日の道順（2分｜0〜2分）", "chapter": 1, "category": "", "kind": "roadmap", "badge": "", "cards": ["<div class=\"card table-card\"><table><tr><th>順番</th><th>時間（授業開始から）</th><th>テーマ</th><th>主な活動・成果</th></tr><tr><td><strong>01</strong></td><td>3限・前半のうち（0〜23分）</td><td><strong>復習と今日のゴール（いまここ）</strong></td><td>Webアプリの構造と今日の進め方を確認</td></tr><tr><td>02</td><td>3限・前半のうち（23〜50分）</td><td>① 入力の幅を広げる</td><td>アプリA：マイクの音を波形にする</td></tr><tr><td>03</td><td>3限・後半（50〜100分）</td><td>② 表現の幅を広げる：反応</td><td>アプリAを改良：音と操作の反応を作り、調整する</td></tr><tr><td>04</td><td>4限・前半（100〜150分）</td><td>② 表現の幅を広げる：見た目と動き</td><td>アプリB：自分の素材で見た目と動きを調整する</td></tr><tr><td>05</td><td>4限・後半のうち（150〜193分）</td><td>③ データの幅を広げる</td><td>アプリC：外部APIの情報を表示する</td></tr><tr><td>06</td><td>4限・後半のうち（193〜200分）</td><td>まとめと宿題</td><td>自由制作のアイデアを3案以上記録する</td></tr></table></div>", "<div class=\"card \"><p>次にすること：前回の制作を振り返り、今日広げる3つの方向を確認します。</p></div>", "<div class=\"card \"><p>授業は100分×2コマです。コマ間の休憩は200分に含みません。アプリAは3限で続けて改良し、4限のアプリB・Cはそれぞれ新しく作ります。</p></div>"]}, {"title": "最近おいしかったものは？（5分｜2〜7分）", "chapter": 1, "category": "1-1. アイスブレイク（5分｜2〜7分）", "kind": "normal", "badge": "課題｜Slack投稿｜5分（投稿・リアクションを含む）", "cards": ["<div class=\"card \"><p>最近食べておいしかったものを、ひとこと教えてください。お店の料理でも、コンビニのおやつでも、自分で作ったものでもOKです。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：最近おいしかったものを1つ、短文で投稿します。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>最近おいしかったもの：コンビニのかぼちゃプリン</pre></div>", "<div class=\"card \"><p>投稿したら、ほかの人の投稿にもリアクションしてみましょう。</p></div>"]}, {"title": "前回の道順（1分｜7〜8分）", "chapter": 1, "category": "1-2. 前回の復習（14分｜7〜21分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>まず、<a href=\"../4_webapp_dev_with_ai/readme.md\" target=\"_blank\" rel=\"noopener noreferrer\">前回の道順</a>を振り返りましょう。</p></div>", "<div class=\"card table-card\"><table><tr><th>順番</th><th>前回の道順</th><th>やったこと</th></tr><tr><td>01</td><td>小さくつくる・仕組みを知る</td><td>ポートフォリオ・タイマー・ToDoを作り、保存やDBの役割を知る</td></tr><tr><td>02</td><td>保存・同期・認証をつなぐ</td><td>ToDoにFirestoreとログインを追加し、同期と権限を確認する</td></tr><tr><td>03</td><td>チャットにログインと履歴を追加</td><td>新しいチャットを作り、ログインと会話履歴の保存を追加する</td></tr><tr><td>04</td><td>チャットの改良・共有・振り返り</td><td>使いやすく改良し、紹介ページを作って共有する</td></tr></table></div>"]}, {"title": "Webアプリの基本構造（1分｜8〜9分）", "chapter": 1, "category": "1-2. 前回の復習（14分｜7〜21分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card image-card\"><figure><a href=\"images/backend.png\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/backend.png\" alt=\"Webアプリケーション、Webサーバー、Web APIサーバー、データベースの関係を示す前回の構成図\"></a><figcaption>Webアプリケーション、Webサーバー、Web APIサーバー、データベースの関係を示す前回の構成図</figcaption></figure><p class=\"caption\">図：第4回「Webアプリの構造を、図で見よう」で使用した構成図。次の2つの演習でも同じ図を使います。</p></div>"]}, {"title": "復習クイズ1：図の各要素は、何を担当している？（3分｜9〜12分）", "chapter": 1, "category": "1-2. 前回の復習（14分｜7〜21分）", "kind": "normal", "badge": "クイズ｜Slack投稿｜3分（考える・投稿する時間を含む）", "cards": ["<div class=\"card \"><p>各要素の役割を、選択肢から選びましょう。</p></div>", "<div class=\"card \"><h3>図の要素</h3><ul><li>A：Webアプリケーション</li><li>B：Webサーバー</li><li>C：Web APIサーバー</li><li>D：データベース</li></ul></div>", "<div class=\"card \"><h3>選択肢（順不同）</h3><ol><li>データを整理して保存する</li><li>ブラウザに表示するHTMLなどを配信する</li><li>利用者が操作する画面や機能を提供する</li><li>リクエストを受け取り、必要な処理を行う</li></ol></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：A〜Dそれぞれに対応する選択肢の番号。</p></div>", "<div class=\"card prompt\"><h3>投稿例（○を番号に置き換える）</h3><pre>演習①\nA：○、B：○、C：○、D：○</pre></div>"]}, {"title": "復習クイズ2：前回使った技術は、図のどこにある？（4分｜12〜16分）", "chapter": 1, "category": "1-2. 前回の復習（14分｜7〜21分）", "kind": "normal", "badge": "クイズ｜Slack投稿｜4分（考える・投稿する時間を含む）", "cards": ["<div class=\"card \"><p>同じ図を使って、次の技術・サービスがどの位置や役割に関係するか考えましょう。</p></div>", "<div class=\"card \"><ul><li>Google AI Studio</li><li>ToDoアプリ・チャットアプリ</li><li>Cloud Firestore</li><li>Firebase Authentication</li><li>Security Rules</li></ul></div>", "<div class=\"card highlight\"><h3>すべてが図の中の箱に収まるだろうか？</h3><p><strong>投稿するもの</strong>：5つの技術・サービスの位置づけを各1行。箱に収まらないと思ったものには、理由をひとこと添えましょう。位置づけが分かるように書き込んだ図の画像でもOKです。</p></div>", "<div class=\"card prompt\"><h3>投稿例（○○を自分の考えに置き換える）</h3><pre>演習②\nGoogle AI Studio：○○\nToDoアプリ・チャットアプリ：○○\nCloud Firestore：○○\nFirebase Authentication：○○\nSecurity Rules：○○</pre></div>"]}, {"title": "AIと行き来しながら、改良する（2分｜19〜21分）", "chapter": 1, "category": "1-2. 前回の復習（14分｜7〜21分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>前回の「AIと行き来しながら、改良する」で見た図を振り返りましょう。</p></div>", "<div class=\"card image-card\"><figure><a href=\"images/ai-development-loop.svg\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/ai-development-loop.svg\" alt=\"アイデア出し、コード生成、バグ修正・デバッグ、コードや仕組みの理解を行き来する図\"></a><figcaption>アイデア出し、コード生成、バグ修正・デバッグ、コードや仕組みの理解を行き来する図</figcaption></figure><p class=\"caption\">図：第4回のスライド「AIと行き来しながら、改良する」から再掲。</p></div>", "<div class=\"card \"><ul><li>アイデア → 生成 → 動作確認 → 不具合の説明 → 修正。</li><li>うまく動かなければ、操作とエラーを伝えて修正する。</li><li>コードや、保存・ログインの仕組みが分からなければ、AIに説明を求める。</li></ul></div>", "<div class=\"card \"><p>今回も、作って終わりにせず、試す・直す・理解することを行き来しながら改良します。</p></div>"]}, {"title": "作れるWebアプリの幅を広げよう（2分｜21〜23分）", "chapter": 1, "category": "1-3. 今日のゴール（2分｜21〜23分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>前回は、Webアプリの基本構造を学び、保存・同期・ログインを追加しました。</p></div>", "<div class=\"card \"><p>今回は、入力・表現・データの3つを工夫して、AIと作れるWebアプリの幅を広げます。</p></div>", "<div class=\"card table-card\"><table><tr><th>工夫ポイント</th><th>問い</th><th>今日試すこと</th></tr><tr><td>① 入力</td><td>何を受け取れる？</td><td>マイクやデバイスの情報</td></tr><tr><td>② 表現</td><td>どう反応する？ どう見せる？</td><td>入力・処理・出力の設計、画像素材</td></tr><tr><td>③ データ</td><td>どんな情報を使える？</td><td>外部APIからのデータ取得</td></tr></table></div>"]}, {"title": "2. 入力の幅を広げる（27分）", "chapter": 2, "kind": "divider", "cards": []}, {"title": "今日の道順（1分｜23〜24分）", "chapter": 2, "category": "", "kind": "roadmap", "badge": "", "cards": ["<div class=\"card table-card\"><table><tr><th>順番</th><th>時間（授業開始から）</th><th>テーマ</th><th>主な活動・成果</th></tr><tr><td>01</td><td>3限・前半のうち（0〜23分）</td><td>復習と今日のゴール</td><td>Webアプリの構造と今日の進め方を確認</td></tr><tr><td><strong>02</strong></td><td>3限・前半のうち（23〜50分）</td><td><strong>① 入力の幅を広げる（いまここ）</strong></td><td>アプリA：マイクの音を波形にする</td></tr><tr><td>03</td><td>3限・後半（50〜100分）</td><td>② 表現の幅を広げる：反応</td><td>アプリAを改良：音と操作の反応を作り、調整する</td></tr><tr><td>04</td><td>4限・前半（100〜150分）</td><td>② 表現の幅を広げる：見た目と動き</td><td>アプリB：自分の素材で見た目と動きを調整する</td></tr><tr><td>05</td><td>4限・後半のうち（150〜193分）</td><td>③ データの幅を広げる</td><td>アプリC：外部APIの情報を表示する</td></tr><tr><td>06</td><td>4限・後半のうち（193〜200分）</td><td>まとめと宿題</td><td>自由制作のアイデアを3案以上記録する</td></tr></table></div>", "<div class=\"card \"><p>次にすること：マイクの音を波形にするアプリAを作ります。</p></div>"]}, {"title": "アプリは、クリック以外に何を受け取れる？（1分｜24〜25分）", "chapter": 2, "category": "2-1. 端末とセンサー（22分｜24〜46分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>これまでは、文字の入力やクリックでアプリを操作しました。マイクの音や端末の動きも、アプリへの入力として使えます。</p></div>", "<div class=\"card table-card\"><table><tr><th>入力の例</th><th>アプリでできることの例</th></tr><tr><td>マイクの音</td><td>音の大きさで画面を変える</td></tr><tr><td>カメラの映像</td><td>撮影した映像を画面に表示する</td></tr><tr><td>端末の傾き・動き</td><td>端末を傾けて操作する</td></tr></table></div>"]}, {"title": "まずはPCで、音を入力してみよう（1分｜25〜26分）", "chapter": 2, "category": "2-1. 端末とセンサー（22分｜24〜46分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>センサーは、音・光・動きなど、身の回りの情報を受け取る装置です。PCにも、マイクやカメラなどの入力装置があります。</p></div>", "<div class=\"card table-card\"><table><tr><th>PCの入力装置</th><th>受け取る情報</th><th>身近な利用例</th></tr><tr><td>マイク</td><td>音</td><td>オンライン会議、録音</td></tr><tr><td>カメラ</td><td>映像</td><td>ビデオ通話、写真撮影</td></tr></table></div>", "<div class=\"card \"><p>今回は、PCのマイクから受け取った音を波形として表示します。</p></div>"]}, {"title": "演習：声を出すと、波形はどう変わる？（15分｜26〜41分）", "chapter": 2, "category": "2-1. 端末とセンサー（22分｜24〜46分）", "kind": "normal", "badge": "演習｜制作・動作確認・Slack投稿｜15分（説明2分＋制作10分＋確認・投稿3分）", "cards": ["<div class=\"card \"><p>Google AI Studioで新しいアプリAを作り、次の指示を入力しましょう。</p></div>", "<div class=\"card prompt\"><h3>入力・投稿の例</h3><pre>PCのマイクから入力された音をリアルタイムで可視化するWebアプリを作ってください。\nマイクの開始・停止ボタンを用意し、音声の波形を画面に表示してください。\nマイクの使用許可がない場合や利用できない場合には、状態が分かるメッセージを表示してください。\n音声を録音・保存・外部送信する必要はありません。ブラウザ内で処理してください。</pre></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：マイクを許可して開始すると、声や音に応じて波形が変わる。停止ボタンでマイクの使用を終了できる。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：アプリAの画面。投稿時間は演習の15分に含みます。</p></div>", "<div class=\"card \"><p>動かない場合は、マイクの接続、OS・ブラウザの使用許可、実行先がHTTPSかを確認しましょう。プレビューで権限エラーが出たら、その直前の操作とエラー文を記録して教員に相談します。</p></div>", "<div class=\"card \"><p>未完成でも、画面＋「試した操作・起きたこと・エラー」を投稿してOKです。マイクが使えない場合は、教員のデモで動きを確認しましょう。</p></div>"]}, {"title": "スマホなら、傾きや移動も入力にできる？（1分｜41〜42分）", "chapter": 2, "category": "2-1. 端末とセンサー（22分｜24〜46分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>スマホは持ち歩くので、動きや位置に関する情報が身近です。</p></div>", "<div class=\"card table-card\"><table><tr><th>センサー・機能の例</th><th>受け取る情報</th><th>入力として使うアイデア</th></tr><tr><td>加速度センサー</td><td>動きの変化</td><td>振ると絵柄が変わる</td></tr><tr><td>ジャイロセンサー</td><td>回転の動き</td><td>傾けてボールを転がす</td></tr><tr><td>位置情報の取得機能</td><td>現在地</td><td>近くの場所を案内する</td></tr></table></div>", "<div class=\"card \"><p>機種によって搭載するセンサーは異なります。ここではアイデアの紹介にとどめ、実装は行いません。</p></div>"]}, {"title": "クイズ：スマホは、どうやって歩数を数える？（2分｜42〜44分）", "chapter": 2, "category": "2-1. 端末とセンサー（22分｜24〜46分）", "kind": "normal", "badge": "クイズ｜Slack投稿｜2分（考える・投稿する時間を含む）", "cards": ["<div class=\"card \"><h3>スマホで歩数を数えるとき、主にどの情報を使っているでしょう？</h3><ol><li>GPSによる現在地の変化</li><li>加速度センサーによる体の動き</li><li>時計で測った経過時間</li></ol></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：選んだ番号を1つ。余裕があれば、理由もひとこと添えましょう。</p></div>", "<div class=\"card prompt\"><h3>投稿例（○を番号に置き換える）</h3><pre>クイズ：○番</pre></div>"]}, {"title": "腕に着けると、どんな入力が身近になる？（2分｜44〜46分）", "chapter": 2, "category": "2-1. 端末とセンサー（22分｜24〜46分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>スマートウォッチは体に着けて使うため、日常の動きや体の状態に関する情報を扱いやすくなります。</p></div>", "<div class=\"card table-card\"><table><tr><th>センサーの例</th><th>受け取る情報</th><th>利用例</th></tr><tr><td>加速度・ジャイロセンサー</td><td>腕や体の動き</td><td>歩数や運動の記録に利用する</td></tr><tr><td>光学式心拍センサー</td><td>光を使って捉えた血流の変化</td><td>心拍数の推定に利用する</td></tr></table></div>", "<div class=\"card \"><p><strong>端末が測れることと、Webアプリから使えることは別です。</strong> ウォッチの情報を使うには、専用アプリやサービスとの連携が必要な場合があります。今回は仕組みと応用例の紹介です。</p></div>"]}, {"title": "マイクの音は、どうやって画面に届いた？（4分｜46〜50分）", "chapter": 2, "category": "2-2. 入力を取得する仕組み（4分｜46〜50分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card diagram\"><div class=\"flow\"><div>PCのマイク</div><span class=\"arrow\">→</span><div>音声取得<br>MediaDevices API</div><span class=\"arrow\">→</span><div>音声解析<br>Web Audio API</div><span class=\"arrow\">→</span><div>画面に波形を描く</div></div><p class=\"caption\">図：アプリAで、マイク入力を波形表示に使うまでの流れ。</p></div>", "<div class=\"card \"><ul><li><strong>API</strong>：用意された機能やデータを、プログラムから利用するための窓口。</li><li><strong>MediaDevices API</strong>：利用者の許可を得て、マイクやカメラの入力を取得する。</li><li><strong>Web Audio API</strong>：音声を解析・処理する。今回は波形の値を表示に使う。</li></ul></div>", "<div class=\"card \"><p>AIがマイクの音を聞いて描いているのではなく、生成されたアプリがブラウザのAPIを使っています。</p></div>", "<div class=\"card \"><p>スマホの動きなどは別のAPIで扱います。利用できる機能は端末・OS・ブラウザ・権限によって異なり、すべてのセンサーを同じ方法で使えるわけではありません。</p></div>", "<div class=\"card \"><p>参考：<a href=\"https://developer.mozilla.org/ja/docs/Web/API/MediaDevices/getUserMedia\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：getUserMedia</a>、<a href=\"https://developer.mozilla.org/ja/docs/Web/API/Web_Audio_API\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：Web Audio API</a>、<a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Sensor_APIs\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：Sensor APIs</a>、<a href=\"https://developer.apple.com/documentation/healthkit\" target=\"_blank\" rel=\"noopener noreferrer\">Apple：HealthKit</a></p></div>"]}, {"title": "3. 表現の幅を広げる：反応を設計する（50分）", "chapter": 3, "kind": "divider", "cards": []}, {"title": "今日の道順（1分｜50〜51分）", "chapter": 3, "category": "", "kind": "roadmap", "badge": "", "cards": ["<div class=\"card table-card\"><table><tr><th>順番</th><th>時間（授業開始から）</th><th>テーマ</th><th>主な活動・成果</th></tr><tr><td>01</td><td>3限・前半のうち（0〜23分）</td><td>復習と今日のゴール</td><td>Webアプリの構造と今日の進め方を確認</td></tr><tr><td>02</td><td>3限・前半のうち（23〜50分）</td><td>① 入力の幅を広げる</td><td>アプリA：マイクの音を波形にする</td></tr><tr><td><strong>03</strong></td><td>3限・後半（50〜100分）</td><td><strong>② 表現の幅を広げる：反応（いまここ）</strong></td><td>アプリAを改良：音と操作の反応を作り、調整する</td></tr><tr><td>04</td><td>4限・前半（100〜150分）</td><td>② 表現の幅を広げる：見た目と動き</td><td>アプリB：自分の素材で見た目と動きを調整する</td></tr><tr><td>05</td><td>4限・後半のうち（150〜193分）</td><td>③ データの幅を広げる</td><td>アプリC：外部APIの情報を表示する</td></tr><tr><td>06</td><td>4限・後半のうち（193〜200分）</td><td>まとめと宿題</td><td>自由制作のアイデアを3案以上記録する</td></tr></table></div>", "<div class=\"card \"><p>次にすること：音と操作のアイデアをそれぞれ試し、反応を調整します。</p></div>"]}, {"title": "同じ音でも、違う反応を作れる？（7分｜51〜58分）", "chapter": 3, "category": "3-1. 反応の仕組み（7分｜51〜58分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>アプリAを続けて改良します。例として、マイクに向かって「ふーっ」と吹くと、風船が少しずつ大きくなるインタラクションを取り上げます。同じ入力でも、処理と出力を変えると体験が変わります。</p></div>", "<div class=\"card table-card\"><table><tr><th>アプリ</th><th>入力：何を受け取る？</th><th>処理：どう扱う？</th><th>出力：何が変わる？</th></tr><tr><td>音声波形</td><td>マイクの音声</td><td>波形の値を取り出す</td><td>波形を描く</td></tr><tr><td>風船</td><td>「ふーっ」と吹く音</td><td>一定以上の音が入っている間、大きさを少しずつ増やす</td><td>息を吹くと風船が膨らむ</td></tr></table></div>", "<div class=\"card diagram\"><div class=\"flow\"><div>入力：音の情報</div><span class=\"arrow\">→</span><div>処理：音が入っている間<br>大きさを増やす</div><span class=\"arrow\">→</span><div>出力：風船の大きさが変わる</div></div><p class=\"caption\">図：音の強さを画面の変化に変換する例。マイクで直接「息の量」を測っているわけではありません。</p></div>"]}, {"title": "演習①：音で何を変化させる？（5分｜58〜63分）", "chapter": 3, "category": "3-2. 反応のアイデアと実装（32分｜58〜90分）", "kind": "normal", "badge": "演習｜アイデア・Slack投稿｜5分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>アプリAの音声入力を使って、何をどう変化させるか考えましょう。ここでは「ふーっと吹くと風船が膨らむ」を例にします。自分の案で進めてもOKです。</p></div>", "<div class=\"card table-card\"><table><tr><th>反応の工夫</th><th>アイデアの例</th></tr><tr><td>対応させる</td><td>音が大きいほど風船が大きくなる</td></tr><tr><td>ためる</td><td>ふーっと吹くたびに風船が少しずつ膨らみ、大きさを保つ</td></tr><tr><td>境目で切り替える</td><td>大きな音がしたら画面の色が変わる</td></tr><tr><td>遅らせる</td><td>音が止まって少ししてから光が消える</td></tr><tr><td>なめらかにする</td><td>音に合わせて、ゆっくり形が変わる</td></tr></table></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：音を使う反応を1つ決め、入力・処理・出力で説明できる。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：入力・処理・出力を各1行。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>入力：マイクに向かって「ふーっ」と吹く音\n処理：一定以上の音が入っている間、風船の大きさを少しずつ増やす\n出力：吹くたびに風船が膨らみ、吹くのをやめても大きさが残る</pre></div>"]}, {"title": "演習②：考えた反応をアプリAで試そう（10分｜63〜73分）", "chapter": 3, "category": "3-2. 反応のアイデアと実装（32分｜58〜90分）", "kind": "normal", "badge": "演習｜アプリAの改良・動作確認・Slack投稿｜10分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>波形表示を残し、考えた反応を追加しましょう。指示例の対象や変化は、自分の案に置き換えます。</p></div>", "<div class=\"card prompt\"><h3>入力・投稿の例</h3><pre>今ある音声波形アプリの機能を残し、画面に風船を追加してください。\nマイクに向かって「ふーっ」と吹くと、その音に反応して風船が少しずつ大きくなるようにしてください。\n吹くのをやめたら、その大きさを保ってください。マイクを停止している間は膨らまないようにしてください。\n画面からはみ出さない最大サイズと、最初の大きさに戻すリセットボタンを用意してください。</pre></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：音の変化で、波形以外のオブジェクトも変化する。マイクを停止したときの表示も確認する。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：アプリ画面＋音によって何が変化したかを1文。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>ふーっと吹くと風船が膨らみ、吹くのをやめても大きさが残りました。</pre></div>", "<div class=\"card \"><p>未完成の場合は、試した指示と、できたこと・困っていることを投稿します。</p></div>"]}, {"title": "演習③：クリック・ドラッグ・スクロールで何を変える？（5分｜73〜78分）", "chapter": 3, "category": "3-2. 反応のアイデアと実装（32分｜58〜90分）", "kind": "normal", "badge": "演習｜アイデア・Slack投稿｜5分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>音への反応に別の操作を1つ追加するとしたら、どんな体験にできるでしょう？</p></div>", "<div class=\"card table-card\"><table><tr><th>追加する入力</th><th>反応の例</th></tr><tr><td>クリック</td><td>風船の色を切り替える、風船を割る</td></tr><tr><td>ドラッグ</td><td>風船を好きな位置に動かす</td></tr><tr><td>スクロール</td><td>背景を昼から夜へ変える、風船の高さを変える</td></tr></table></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：追加する入力と変化を1組決める。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：追加する入力と、それによる変化を各1行。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>追加する入力：風船をドラッグする\n変化：風船を好きな位置に動かす。息を吹くと膨らむ反応は残す。</pre></div>"]}, {"title": "演習④：音と操作を組み合わせて試そう（12分｜78〜90分）", "chapter": 3, "category": "3-2. 反応のアイデアと実装（32分｜58〜90分）", "kind": "normal", "badge": "演習｜アプリAの改良・動作確認・Slack投稿｜12分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>選んだ操作を追加し、音への反応と、追加した操作への反応を両方試しましょう。</p></div>", "<div class=\"card prompt\"><h3>入力・投稿の例</h3><pre>音声波形と、ふーっと吹くと風船が膨らむ機能を残してください。\n風船をドラッグして好きな位置に移動できるようにしてください。\n移動した後も、息を吹くと膨らむようにしてください。</pre></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：音と、クリック・ドラッグ・スクロールなどの操作で、それぞれの反応を確認できる。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：アプリ画面＋それぞれの入力で何が変わるかを1文。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>ふーっと吹くと風船が膨らみ、ドラッグで好きな位置に動かせます。</pre></div>", "<div class=\"card \"><p>スクロールで変化しにくい場合は、画面の構成を確認するか、クリック・ドラッグに切り替えてもOKです。</p></div>"]}, {"title": "演習⑤：試して、気になる反応を1つ直そう（10分｜90〜100分）", "chapter": 3, "category": "3-2. 反応のアイデアと実装（32分｜58〜90分）", "kind": "normal", "badge": "演習｜操作・調整・再確認｜10分（Slack投稿なし）", "cards": ["<div class=\"card \"><p>作ったアプリを操作して、反応しすぎる・動きが速すぎる・操作しにくいところがないか確かめましょう。</p></div>", "<div class=\"card table-card\"><table><tr><th>試して気づいたこと</th><th>調整の例</th></tr><tr><td>周囲の小さな音にも反応する</td><td>一定以上の音にだけ反応させる</td></tr><tr><td>変化が速すぎる</td><td>変化量や、変化する速さを小さくする</td></tr><tr><td>細かく震える</td><td>音の値をならして、変化をなめらかにする</td></tr><tr><td>クリックやドラッグがしにくい</td><td>操作する範囲を広げる</td></tr><tr><td>一度動かすと試し直せない</td><td>リセットする操作を用意する</td></tr></table></div>", "<div class=\"card \"><p>気になる点を1つ選び、AIに調整を依頼しましょう。</p></div>", "<div class=\"card prompt\"><h3>入力・投稿の例</h3><pre>周囲の小さな物音だけでも風船が膨らんでしまいます。\nある程度大きな音にだけ反応するように調整してください。\n反応し始める音の大きさを画面のスライダーで調整できるようにしてください。\n波形表示と、風船をドラッグで移動する機能は残してください。</pre></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：1点以上調整し、同じ操作をもう一度試して調整前後の違いを確認できる。音と追加操作の両方が引き続き動く。</p></div>", "<div class=\"card \"><p><strong>提出物</strong>：なし。投稿せずに、動作確認と調整に時間を使いましょう。</p></div>"]}, {"title": "4. 表現の幅を広げる：意図した見た目と動きに近づける（50分）", "chapter": 4, "kind": "divider", "cards": []}, {"title": "今日の道順（1分｜100〜101分）", "chapter": 4, "category": "", "kind": "roadmap", "badge": "", "cards": ["<div class=\"card table-card\"><table><tr><th>順番</th><th>時間（授業開始から）</th><th>テーマ</th><th>主な活動・成果</th></tr><tr><td>01</td><td>3限・前半のうち（0〜23分）</td><td>復習と今日のゴール</td><td>Webアプリの構造と今日の進め方を確認</td></tr><tr><td>02</td><td>3限・前半のうち（23〜50分）</td><td>① 入力の幅を広げる</td><td>アプリA：マイクの音を波形にする</td></tr><tr><td>03</td><td>3限・後半（50〜100分）</td><td>② 表現の幅を広げる：反応</td><td>アプリAを改良：音と操作の反応を作り、調整する</td></tr><tr><td><strong>04</strong></td><td>4限・前半（100〜150分）</td><td><strong>② 表現の幅を広げる：見た目と動き（いまここ）</strong></td><td>アプリB：自分の素材で見た目と動きを調整する</td></tr><tr><td>05</td><td>4限・後半のうち（150〜193分）</td><td>③ データの幅を広げる</td><td>アプリC：外部APIの情報を表示する</td></tr><tr><td>06</td><td>4限・後半のうち（193〜200分）</td><td>まとめと宿題</td><td>自由制作のアイデアを3案以上記録する</td></tr></table></div>", "<div class=\"card \"><p>次にすること：見た目と動きを考え、手描きかAIで素材を作り、アプリBで試して調整します。</p></div>"]}, {"title": "自分の絵が、音や操作に反応したら？（6分｜101〜107分）", "chapter": 4, "category": "4-1. 表現の具体化（6分｜101〜107分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>第2章ではマイクなどの入力を、第3章では入力に応じた反応の作り方を試しました。今度はそれらを応用し、自分で用意した画像を使って、<strong>より意図通りのアプリを作るテクニック</strong>を練習しましょう。</p></div>", "<div class=\"card \"><p>まずは、画像と反応を組み合わせた例を見てみましょう。</p></div>", "<div class=\"card table-card\"><table><tr><th>表現の例</th><th>入力</th><th>起こること</th><th>使う画像素材</th></tr><tr><td>息で飛ばすたんぽぽ</td><td>マイクに「ふーっ」と吹く</td><td>綿毛がふわっと舞い、ゆっくり落ちる</td><td>綿毛1つの絵</td></tr><tr><td>触ると広がる水面</td><td>クリック・ドラッグ</td><td>触った場所から波紋が重なって広がる</td><td>水面の背景画</td></tr><tr><td>スクロールで変わる空</td><td>スクロール</td><td>空が昼から夕方、夜へ変わり、星が現れる</td><td>空や雲、星の絵</td></tr></table></div>", "<div class=\"card \"><h3>同じ画像でも、どんな入力にどう反応するかで、体験が変わります。</h3><p>ここからは、新しいアプリBを作ります。手描きでもAIで作った画像でもOKです。素材1枚と反応1つから始めましょう。</p></div>"]}, {"title": "演習①：どんなインタラクティブアートを作成する？（8分｜107〜115分）", "chapter": 4, "category": "4-1. 表現の具体化（6分｜101〜107分）", "kind": "normal", "badge": "演習｜アイデア・Slack投稿｜8分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>どんな見た目で、どう反応してほしいか考えましょう。<strong>題材・入力・反応・必要な画像</strong>をセットで決めます。</p></div>", "<div class=\"card \"><p>迷ったら、自然の形や動きから発想してみましょう。自然以外の題材でも構いません。</p></div>", "<div class=\"card table-card\"><table><tr><th>発想のきっかけ</th><th>どんな動きや変化がある？</th></tr><tr><td>風・綿毛・落ち葉</td><td>舞う、揺れる、集まる、散らばる</td></tr><tr><td>水・雨</td><td>波紋が広がる、落ちる、たまる</td></tr><tr><td>花・植物</td><td>育つ、開く、しおれる</td></tr><tr><td>空・光・星</td><td>色が変わる、明滅する、流れる</td></tr></table></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：入力と反応を1組決め、そのために用意する画像が分かる。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：題材・入力・反応・必要な画像を各1行。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>題材：風に舞うたんぽぽの綿毛\n入力：マイクにふーっと吹く\n反応：吹くと綿毛が舞い上がり、音が止まるとゆっくり落ちる\n必要な画像：たんぽぽの絵。余裕があれば綿毛1本も用意する</pre></div>"]}, {"title": "演習②：アプリに使う画像を、描くかAIで作ろう（15分｜115〜130分）", "chapter": 4, "category": "4-1. 表現の具体化（6分｜101〜107分）", "kind": "normal", "badge": "演習｜素材制作・確認・Slack投稿｜15分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>全部を一度に作るより、要素を別々に作って組み合わせると、イメージに近づけやすいことがあります。</p></div>", "<div class=\"card \"><p>そのため、ここでは自分のアイデアに必要な画像を用意しましょう。次の方法から選んでも、組み合わせてもOKです。</p></div>", "<div class=\"card table-card\"><table><tr><th>作り方</th><th>進め方</th></tr><tr><td>自分で描く</td><td>描画アプリで描いて保存する。紙に描いて撮影してもOK</td></tr><tr><td>AI（Gemini、ChatGPTなど）で作る</td><td>まず描いてほしいものを伝え、生成結果を見て必要なところを直す</td></tr><tr><td>過去の自作を参考にAIで作る</td><td>自分が描いた絵を添付し、色使い・線・質感などのテイストを生かして、別の題材を描いてもらう</td></tr></table></div>", "<div class=\"card prompt\"><h3>AI（Gemini、ChatGPTなど）で作る場合の指示例</h3><pre>息を吹くと綿毛が飛ぶWebアプリに使う、たんぽぽの絵を描いてください。\n\n綿毛がついたたんぽぽを、和紙に淡い水彩で描いたような雰囲気にしてください。\n紙の繊維やにじみが少し感じられ、輪郭はやわらかくしてください。\n白い綿毛が見えるように、背景はくすんだ淡い青にしてください。\nたんぽぽ全体が画面に収まる、余白のある構図にしてください。\n文字は入れないでください。</pre></div>", "<div class=\"card prompt\"><h3>過去の自作を使う場合の指示例</h3><pre>添付した自分の絵の色使い・線・質感を参考に、たんぽぽの絵を描いてください。\n題材は変えつつ、元の絵のテイストを生かしてください。</pre></div>", "<div class=\"card \"><p>出てきた画像を見て、「紙の質感をもう少し強く」「背景をもう少し淡く」など、自分のイメージに合わせて調整しましょう。</p></div>", "<div class=\"card \"><p>余裕があれば、動かす要素（例：綿毛1本）の画像も別に用意すると、組み合わせて使いやすくなります。生成した画像を添えて、同じ画風で作るように伝えましょう。</p></div>", "<div class=\"card prompt\"><h3>入力・投稿の例</h3><pre>この絵と同じ色合い・画風で、飛ばす素材として使う綿毛を1本描いてください。\n綿毛にも和紙や水彩の質感を残し、背景は透明にしてください。</pre></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：アプリに使う画像を1枚以上、PNGやJPEGなどの画像ファイルとして保存できる。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：使う画像。</p></div>", "<div class=\"card \"><p>保存した画像を開き、向き・余分な余白・背景を確認しましょう。紙の絵を撮影した場合は、必要な部分が見やすくなるように切り抜きます。</p></div>"]}, {"title": "演習③：画像をAI Studioに渡して、思いどおりに動かそう（20分｜130〜150分）", "chapter": 4, "category": "4-1. 表現の具体化（6分｜101〜107分）", "kind": "normal", "badge": "演習｜新規制作・動作確認・改良・Slack投稿｜20分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>Google AI Studioで<strong>新しいアプリB</strong>を作り、用意した画像を添付します。「この画像を何に使い、何をするとどう変わるか」を伝えましょう。</p></div>", "<div class=\"card prompt\"><h3>たんぽぽの絵を添付して入力するプロンプト例</h3><pre>添付したたんぽぽの絵を使って、息を吹くと綿毛が舞うWebアプリを作ってください。\n\n【見た目】\n添付画像をメインの背景として使い、和紙の繊維や水彩のにじみをそのまま生かしてください。\n画像を縦横に引き伸ばさず、たんぽぽ全体が見えるように配置してください。\n画像の外側の余白も、絵になじむくすんだ淡い青にしてください。\nボタンや説明は小さくまとめ、絵を主役にしてください。\n\n【反応】\nマイクに向かってふーっと吹くと、その音の強さに応じて、たんぽぽの周りから綿毛がふわっと舞い上がるようにしてください。</pre></div>", "<div class=\"card prompt\"><h3>入力・投稿の例（続き）</h3><pre>音が止まったら、飛んでいる綿毛はゆっくり落ちるようにしてください。\n綿毛も背景と同じ、やわらかな和紙・水彩風の雰囲気に合わせてください。\n\n【操作】\nマイクの開始・停止ボタンと、最初の状態に戻すリセットボタンを用意してください。\n操作方法と、マイクを使用できない場合のメッセージを表示してください。\n音声は録音・保存・外部送信せず、ブラウザ内で処理してください。</pre></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：自分で用意した画像がアプリに表示され、少なくとも1種類の入力で意図した変化が起きる。</p></div>", "<div class=\"card \"><p>動いたら、反応の速さ・変化の大きさ・画像の配置を調整してみましょう。第3章で試したように、同じ操作を繰り返して確かめます。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：アプリの画面＋意図した見た目や動きと、実際にできたことを1〜2文。動きが伝わりにくければ、操作前後の2枚や短い画面録画でもOKです。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>手描きの綿毛がふわっと舞う様子を目指しました。\nふーっと吹くと舞い上がり、音が止まるとゆっくり落ちるようにしました。</pre></div>", "<div class=\"card \"><p>画像が表示されない、入力に反応しない場合は、その直前の操作と現象をAIに伝えて修正します。未完成でも、できたこと・困っていることを画面と一緒に投稿しましょう。</p></div>"]}, {"title": "5. データの幅を広げる（43分）", "chapter": 5, "kind": "divider", "cards": []}, {"title": "今日の道順（1分｜150〜151分）", "chapter": 5, "category": "", "kind": "roadmap", "badge": "", "cards": ["<div class=\"card table-card\"><table><tr><th>順番</th><th>時間（授業開始から）</th><th>テーマ</th><th>主な活動・成果</th></tr><tr><td>01</td><td>3限・前半のうち（0〜23分）</td><td>復習と今日のゴール</td><td>Webアプリの構造と今日の進め方を確認</td></tr><tr><td>02</td><td>3限・前半のうち（23〜50分）</td><td>① 入力の幅を広げる</td><td>アプリA：マイクの音を波形にする</td></tr><tr><td>03</td><td>3限・後半（50〜100分）</td><td>② 表現の幅を広げる：反応</td><td>アプリAを改良：音と操作の反応を作り、調整する</td></tr><tr><td>04</td><td>4限・前半（100〜150分）</td><td>② 表現の幅を広げる：見た目と動き</td><td>アプリB：自分の素材で見た目と動きを調整する</td></tr><tr><td><strong>05</strong></td><td>4限・後半のうち（150〜193分）</td><td><strong>③ データの幅を広げる（いまここ）</strong></td><td>アプリC：外部APIの情報を表示する</td></tr><tr><td>06</td><td>4限・後半のうち（193〜200分）</td><td>まとめと宿題</td><td>自由制作のアイデアを3案以上記録する</td></tr></table></div>"]}, {"title": "アプリの外から、どんな情報を受け取れる？（4分｜151〜155分）", "chapter": 5, "category": "5-1. 外部API（27分｜151〜178分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>ブラウザのAPIではマイクなどの機能を使いました。<strong>外部APIでは、インターネット上のサービスのデータなどを使います。</strong></p></div>", "<div class=\"card diagram\"><div class=\"flow\"><div>Webアプリ<br>リクエストを送る</div><span class=\"arrow\">→</span><div>外部API<br>データの窓口</div><span class=\"arrow\">→</span><div>外部サービスのデータ</div></div><p class=\"caption\">取得したデータは、外部APIからWebアプリへ返されます。</p><p class=\"caption\">図：アプリが外部APIへ情報を要求し、結果を受け取る流れ。</p></div>", "<div class=\"card \"><p>利用前には、規約・料金・アクセス回数の制限・APIキーの要否・出典表示を確認します。画像を使うときは画像ごとの権利・ライセンスも確認しましょう。データを取得できることと、自由に転載できることは別です。</p></div>", "<div class=\"card \"><p>秘密のAPIキーをブラウザのコードへ埋め込んだり、Slackへ投稿したりしません。今回は教員が案内する、秘密のキーを入力せずに試せる取得例を使います。</p></div>"]}, {"title": "演習：JSONデータの項目名と値を読み取ろう（9分｜155〜164分）", "chapter": 5, "category": "5-1. 外部API（27分｜151〜178分）", "kind": "normal", "badge": "演習｜データを読む・Slack投稿｜9分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>APIから返るデータでは、JSONという形式がよく使われます。次は読み方を練習するための<strong>架空のデータ</strong>です。</p></div>", "<div class=\"card prompt\"><h3>JSONの例</h3><pre>{\n  &quot;temperature&quot;: 22,\n  &quot;weather&quot;: &quot;sunny&quot;,\n  &quot;windSpeed&quot;: 3.5\n}</pre></div>", "<div class=\"card \"><p><code>&quot;項目名&quot;: 値</code> が1組です。<code>{ }</code> はまとまり、<code>,</code> は項目の区切り。文字列は <code>&quot; &quot;</code> で囲み、数値は囲みません。</p></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：気温・天気・風速の項目名と値を読み取れる。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：気温・天気・風速に当たる項目名と値を各1行。</p></div>", "<div class=\"card prompt\"><h3>投稿例（○○を読み取った内容に置き換える）</h3><pre>気温の項目名：○○／値：○○\n天気の項目名：○○／値：○○\n風速の項目名：○○／値：○○</pre></div>", "<div class=\"card \"><p>実際のAPIでは、まとまりの中に別のまとまりが入る「入れ子」や、<code>[ ]</code> で囲む一覧（配列）もあります。上の項目名が、すべての天気APIで共通するわけではありません。</p></div>"]}, {"title": "公開されているAPIには、どんなものがある？（3分｜164〜167分）", "chapter": 5, "category": "5-1. 外部API（27分｜151〜178分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>天気・キャラクター・美術作品など、さまざまな情報がAPIで公開されています。どんなアプリに使えそうか、例を見てみましょう。</p></div>", "<div class=\"card table-card\"><table><tr><th>候補・公式資料</th><th>受け取るデータ</th><th>アプリCの例</th></tr><tr><td><a href=\"https://open-meteo.com/en/docs\" target=\"_blank\" rel=\"noopener noreferrer\">Open-Meteo</a></td><td>気温・天気・風速など</td><td>京都の気温を表示する</td></tr><tr><td><a href=\"https://pokeapi.co/docs/v2\" target=\"_blank\" rel=\"noopener noreferrer\">PokéAPI</a></td><td>ポケモンの名前・タイプなど</td><td>名前や特徴を表示する図鑑</td></tr><tr><td><a href=\"https://api.artic.edu/docs/\" target=\"_blank\" rel=\"noopener noreferrer\">Art Institute of Chicago API</a></td><td>美術作品のタイトル・作家など</td><td>作品情報のカードを表示する</td></tr></table></div>", "<div class=\"card \"><p>公式資料では、取得できる情報や利用方法を確認できます。次の演習では、この3候補から1つ選んで実際のデータを受け取ります。</p></div>"]}, {"title": "演習：APIから実際のデータを受け取ろう（11分｜167〜178分）", "chapter": 5, "category": "5-1. 外部API（27分｜151〜178分）", "kind": "normal", "badge": "演習｜API取得・確認・Slack投稿｜11分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>以下の候補から1つ選び、取得例のURLをブラウザで開きましょう。返ってきたデータから、少なくとも1つの値を探します。</p></div>", "<div class=\"card table-card\"><table><tr><th>候補</th><th>開くURL</th><th>探す項目の例</th></tr><tr><td>Open-Meteo</td><td><a href=\"https://api.open-meteo.com/v1/forecast?latitude=35.01&amp;longitude=135.77&amp;current=temperature_2m&amp;timezone=Asia%2FTokyo\" target=\"_blank\" rel=\"noopener noreferrer\">京都付近の現在の気温</a></td><td><code>current</code> の中の <code>temperature_2m</code>。単位は <code>current_units</code></td></tr><tr><td>PokéAPI</td><td><a href=\"https://pokeapi.co/api/v2/pokemon/pikachu\" target=\"_blank\" rel=\"noopener noreferrer\">ピカチュウの情報</a></td><td><code>name</code>、<code>height</code>。高さの単位は公式資料で確認</td></tr><tr><td>Art Institute of Chicago API</td><td><a href=\"https://api.artic.edu/api/v1/artworks/27992?fields=id,title,artist_display\" target=\"_blank\" rel=\"noopener noreferrer\">作品情報1件</a></td><td><code>data</code> の中の <code>title</code>、<code>artist_display</code></td></tr></table></div>", "<div class=\"card \"><p>URLは要求先の場所です。Open-Meteoの例では、<code>?</code> 以降で緯度・経度・取得したい情報を指定しています。</p></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：実際のAPIレスポンスから、項目名と値を1つ以上確認できる。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：取得結果の画面＋API名・項目・実際に表示された値。値は自分の画面から転記します。</p></div>", "<div class=\"card prompt\"><h3>入力・投稿の例</h3><pre>使ったAPI：Open-Meteo\n取得項目：current.temperature_2m\n取得した値：（自分の画面の数値と単位）</pre></div>", "<div class=\"card \"><p>取得できなければ、URL・操作・エラーを記録して教員に相談します。配布JSONや前の架空JSONで次へ進む場合は、<strong>「サンプルデータ使用・実際のAPI取得は未確認」</strong>と明記しましょう。</p></div>"]}, {"title": "演習：APIを使って、天気アプリや図鑑を作ってみよう（12分｜178〜190分）", "chapter": 5, "category": "5-2. 外部データを使うアプリ（12分｜178〜190分）", "kind": "normal", "badge": "演習｜新規制作・動作確認・Slack投稿｜12分（投稿時間を含む）", "cards": ["<div class=\"card \"><p>選んだAPIを使って、小さなアプリを作りましょう。何を見せるか、どんな見た目にするかは自分で決めてOKです。</p></div>", "<div class=\"card table-card\"><table><tr><th>使うAPI</th><th>作るアプリの例</th></tr><tr><td><a href=\"https://open-meteo.com/en/docs\" target=\"_blank\" rel=\"noopener noreferrer\">Open-Meteo</a></td><td>好きな街の天気が分かるアプリ</td></tr><tr><td><a href=\"https://pokeapi.co/docs/v2\" target=\"_blank\" rel=\"noopener noreferrer\">PokéAPI</a></td><td>ポケモンの情報を調べる図鑑</td></tr><tr><td><a href=\"https://api.artic.edu/docs/\" target=\"_blank\" rel=\"noopener noreferrer\">Art Institute of Chicago API</a></td><td>美術作品の情報を紹介するアプリ</td></tr></table></div>", "<div class=\"card \"><p>Google AI Studioで<strong>新しいアプリC</strong>を作ります。使うAPIと、作りたいものを伝えましょう。</p></div>", "<div class=\"card prompt\"><h3>指示例</h3><pre>Open-Meteoを使って、京都の天気が分かるWebアプリを作ってください。\n現在の気温と天気を、見やすい文字とアイコンで表示してください。\nAPIから実際のデータを取得し、更新ボタンで最新の情報を取得できるようにしてください。\n読み込み中や取得に失敗した場合も分かるようにしてください。\nデータの時刻と、データ提供元のOpen-Meteoも表示してください。</pre></div>", "<div class=\"card highlight\"><p><strong>完了の目安</strong>：選んだAPIから取得した情報を、アプリ画面に表示できる。表示された内容を、前の演習で見た取得結果と見比べる。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：アプリCの画面＋使ったAPIと、何ができるアプリかを1文。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>Open-Meteoを使って、京都の気温と天気が分かるアプリを作りました。</pre></div>", "<div class=\"card \"><p>取得できない場合は、前の演習で使ったURLやエラーをAIに伝えて修正しましょう。サンプルデータを使った場合は、その旨と未確認の点を投稿に添えます。</p></div>", "<div class=\"card \"><p>時間が余ったら、都市を選べるようにしたり、データに合わせて見た目を変えたりしてみましょう。</p></div>"]}, {"title": "使ったデータは、どこから来た？（3分｜190〜193分）", "chapter": 5, "category": "5-3. 振り返り（3分｜190〜193分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>自分のアプリCについて、次の3点を確認しましょう。追加のSlack投稿は不要です。</p></div>", "<div class=\"card \"><ul><li>データは、どのサービスにあった？</li><li>どのURLへ要求し、どの項目を受け取った？</li><li>受け取ったデータを、画面でどう表示した？</li></ul></div>", "<div class=\"card \"><p><strong>読む → 取得する → 表示する。</strong> 取得元を変えると、同じWebアプリでも作れる機能が広がります。</p></div>"]}, {"title": "6. まとめと宿題（7分）", "chapter": 6, "kind": "divider", "cards": []}, {"title": "今日の道順（1分｜193〜194分）", "chapter": 6, "category": "", "kind": "roadmap", "badge": "", "cards": ["<div class=\"card table-card\"><table><tr><th>順番</th><th>時間（授業開始から）</th><th>テーマ</th><th>主な活動・成果</th></tr><tr><td>01</td><td>3限・前半のうち（0〜23分）</td><td>復習と今日のゴール</td><td>Webアプリの構造と今日の進め方を確認</td></tr><tr><td>02</td><td>3限・前半のうち（23〜50分）</td><td>① 入力の幅を広げる</td><td>アプリA：マイクの音を波形にする</td></tr><tr><td>03</td><td>3限・後半（50〜100分）</td><td>② 表現の幅を広げる：反応</td><td>アプリAを改良：音と操作の反応を作り、調整する</td></tr><tr><td>04</td><td>4限・前半（100〜150分）</td><td>② 表現の幅を広げる：見た目と動き</td><td>アプリB：自分の素材で見た目と動きを調整する</td></tr><tr><td>05</td><td>4限・後半のうち（150〜193分）</td><td>③ データの幅を広げる</td><td>アプリC：外部APIの情報を表示する</td></tr><tr><td><strong>06</strong></td><td>4限・後半のうち（193〜200分）</td><td><strong>まとめと宿題（いまここ）</strong></td><td>自由制作のアイデアを3案以上記録する</td></tr></table></div>", "<div class=\"card \"><p>次にすること：今日の学びを振り返り、自由制作のアイデアを3案以上考えます。</p></div>"]}, {"title": "作れるアプリの幅は、どう広がった？（1分｜194〜195分）", "chapter": 6, "category": "6-1. 今日の振り返り（1分｜194〜195分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card table-card\"><table><tr><th>今日広げたもの</th><th>次の制作で使うなら？</th></tr><tr><td>① 入力</td><td>マイクやセンサーの情報で操作する</td></tr><tr><td>② 表現</td><td>操作への反応や、自分で作った画像素材を使う</td></tr><tr><td>③ データ</td><td>外部APIから受け取った情報を使う</td></tr></table></div>"]}, {"title": "次回からは、自由なテーマで作ろう（1分｜195〜196分）", "chapter": 6, "category": "6-2. 自由制作と宿題（5分｜195〜200分）", "kind": "normal", "badge": "", "cards": ["<div class=\"card \"><p>全7回の授業を振り返りましょう。次回からは、これまで試したことを自分の制作に使う総合演習です。</p></div>", "<div class=\"card table-card\"><table><tr><th>回数・日程</th><th>テーマ</th><th>担当講師</th></tr><tr><td>1 (9/25)</td><td>AI 基礎</td><td>伊藤、髙田</td></tr><tr><td>2 (10/2)</td><td>プロンプトエンジニアリング</td><td>髙田</td></tr><tr><td>3 (10/9)</td><td>AI の活用と倫理</td><td>伊藤</td></tr><tr><td>4 (10/16)</td><td>AI を活用したアプリ生成 ①</td><td>伊藤</td></tr><tr><td><strong>5 (10/23)</strong></td><td><strong>AI を活用したアプリ生成 ②</strong></td><td><strong>髙田</strong></td></tr><tr><td>6 (11/6)</td><td>総合演習</td><td>髙田、伊藤</td></tr><tr><td>7 (11/13)</td><td>総合演習</td><td>伊藤、髙田</td></tr></table></div>", "<div class=\"card \"><h3>次回は11月6日、第6回「総合演習①」です。第7回の11月13日も、続けて自由制作に取り組みます。</h3><p>今日のマイク入力・画像生成・外部APIを、すべて使う必要はありません。前回のToDoやチャットで試した保存・ログインも含め、目的に合う方法を選べます。</p></div>"]}, {"title": "宿題：自分が作りたいものを3案考えよう（4分｜196〜200分）", "chapter": 6, "category": "6-2. 自由制作と宿題（5分｜195〜200分）", "kind": "normal", "badge": "宿題｜アイデア3案以上・Slack投稿｜4分（投稿時間を含む）", "cards": ["<div class=\"card highlight\"><p><strong>完了の目安</strong>：「何を作る／誰が使う／何ができる」を3案以上記録し、一番興味がある案に印を付ける。</p></div>", "<div class=\"card highlight\"><p><strong>投稿するもの</strong>：制作アイデア3案以上。最も興味がある案に★を付けましょう。</p></div>", "<div class=\"card prompt\"><h3>投稿例</h3><pre>★1. 課題しめきり管理アプリ／大学生／提出日と進み具合をまとめて確認する\n2. 英単語クイズ／英語を学ぶ人／間違えた単語を繰り返し練習する\n3. 作品紹介サイト／展示を見に来る人／作品の画像と制作意図を読む\n4. 冷蔵庫の食材メモ／自炊する人／残っている食材と買うものを管理する\n5. 音で景色が変わる作品／気分転換したい人／声や音で色と形を変える</pre></div>", "<div class=\"card \"><p>次回はこのメモを出発点に、まず小さく作り、動かして確かめ、改良しましょう。</p></div>"]}];const chapterNames={"1": "復習と今日のゴール（23分）", "2": "入力の幅を広げる（27分）", "3": "表現の幅を広げる：反応を設計する（50分）", "4": "表現の幅を広げる：意図した見た目と動きに近づける（50分）", "5": "データの幅を広げる（43分）", "6": "まとめと宿題（7分）"};
const host=document.getElementById('slides');
let slides=[],current=0;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900));}
function createSlide(data,continued=false){
 const s=document.createElement('section');s.className='slide active '+data.kind;
 s.dataset.chapter=data.chapter;
 const time=data.title.match(/（[^）]*分[^）]*）$/)?.[0]||'';
 const title=data.title.replace(/（[^）]*分[^）]*）$/,'');
 s.innerHTML=`<header class="slide-header"><p class="subtitle">${esc((data.category||('第5回｜'+(data.chapter?chapterNames[data.chapter]:'2026年10月23日'))).replace(/（.*$/,''))}${time?'　'+esc(time):''}${continued?'　｜ 続き':''}</p><h1 class="slide-title">${esc(title)}</h1>${data.badge?`<span class="badge">${esc(data.badge)}</span>`:''}</header><div class="content"></div>`;
 host.append(s);slides.push(s);return s;
}
function build(){
 host.innerHTML='';slides=[];
 for(const data of sourceSlides){
  let s=createSlide(data);
  if(data.kind==='divider'){
   s.querySelector('.content').innerHTML=`<p class="divider-number">SECTION ${String(data.chapter).padStart(2,'0')}</p><p style="font-size:26px">次のページで、今日の道順を確認します。</p>`;continue;
  }
  if(data.kind==='roadmap'){s.classList.add('wide');continue;}
  const wide=data.cards.some(x=>/table-card|diagram/.test(x)||(data.kind!=='cover'&&/image-card/.test(x))||(/<pre>/.test(x)&&(x.replace(/<[^>]+>/g,'').length>240||x.split('\n').length>6)));
  if(wide)s.classList.add('wide');
  const makeColumns=()=>{const c=s.querySelector('.content');c.innerHTML='<div class="column"></div>'+(wide?'':'<div class="column"></div>');return [...c.children];};
  let cols=makeColumns(),col=0;
  // Measure all layout at native canvas scale, independent of viewport.
  for(const markup of data.cards){
   const template=document.createElement('template');template.innerHTML=markup;const node=template.content.firstElementChild;
   let target=cols[col];target.append(node);
   if(target.scrollHeight>target.clientHeight+1 && target.children.length>1){
    node.remove();col++;
    if(col>=cols.length){s.classList.remove('active');s=createSlide(data,true);if(wide)s.classList.add('wide');cols=makeColumns();col=0;}
    cols[col].append(node);
   }
  }
  s.classList.remove('active');
 }
 // Install stable URLs only after continuation pages have been created.
 slides.forEach((s,i)=>{s.id=`slide-${i+1}`;s.querySelector('h1').id=`title-${i+1}`;s.setAttribute('aria-labelledby',`title-${i+1}`);});
 const roadmapData=sourceSlides.filter(x=>x.kind==='roadmap');
 const routeTimes=['3限・前半｜0〜23分','3限・前半｜23〜50分','3限・後半｜50〜100分','4限・前半｜100〜150分','4限・後半｜150〜193分','4限・後半｜193〜200分'];
 for(const s of slides.filter(x=>x.classList.contains('roadmap'))){
  const currentChapter=Number(s.dataset.chapter);
  const source=roadmapData.find(d=>d.chapter===currentChapter);
  const nextStep=source?.cards.find(c=>c.includes('次にすること：'))||'';
  const group=(start,end,label)=>`<div class="roadmap-group"><h3>${label}</h3>`+Array.from({length:end-start+1},(_,j)=>{
   const n=start+j,index=slides.findIndex(x=>x.classList.contains('divider')&&Number(x.dataset.chapter)===n);
   return `<a class="roadmap-item ${n===currentChapter?'current':''}" href="#slide-${index+1}" ${n===currentChapter?'aria-current="step"':''}><b>${String(n).padStart(2,'0')}　${esc(chapterNames[n].replace(/（.*$/,''))}${n===currentChapter?'（いまここ）':''}</b><small>${routeTimes[n-1]}</small></a>`;
  }).join('')+'</div>';
  s.querySelector('.content').innerHTML=`<div class="roadmap-grid">${group(1,3,'3限｜100分')}${group(4,6,'4限｜100分')}</div><p class="route-note">左を上から下へ → 休憩 → 右を上から下へ。投稿時間は各演習に含みます。</p>${nextStep.replace(/class="card [^"]*"/,'class="route-note"')}`;
 }
 document.getElementById('total').textContent=slides.length;
 fromHash();fit();
}
function showSlide(n){
 current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===current));
 document.getElementById('page').textContent=current+1;
 document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;
 const ch=slides[current].dataset.chapter;
 document.getElementById('course').textContent='2026 / 第5回'+(Number(ch)?` · ${String(ch).padStart(2,'0')} / 6　${chapterNames[ch].replace(/（.*$/,'')}`:' AIとつくるWebアプリ②');
 document.querySelector('.progress').style.width=`${(current+1)/slides.length*100}%`;
 history.replaceState(null,'',`#${slides[current].id}`);
}
function fromHash(){const m=location.hash.match(/^#slide-(\d+)$/);showSlide(m?Number(m[1])-1:0);}
document.getElementById('prev').addEventListener('click',()=>showSlide(current-1));
document.getElementById('next').addEventListener('click',()=>showSlide(current+1));
document.getElementById('toc').addEventListener('click',()=>{const ch=slides[current].dataset.chapter;const n=slides.findIndex(s=>s.classList.contains('roadmap')&&s.dataset.chapter===ch);showSlide(n<0?slides.findIndex(s=>s.classList.contains('roadmap')):n);});
document.addEventListener('click',e=>{const a=e.target.closest('.roadmap-item');if(a){e.preventDefault();showSlide(Number(a.hash.slice(7))-1);}});
document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('a,button,summary,input,textarea,select,[contenteditable]'))return;if(['ArrowRight','ArrowLeft',' '].includes(e.key)){e.preventDefault();showSlide(current+(e.key==='ArrowLeft'?-1:1));}});
window.addEventListener('resize',fit);window.addEventListener('hashchange',fromHash);
document.fonts.ready.then(()=>{document.documentElement.style.setProperty('--scale',1);build();window.slidesReady=true;});
</script>

講師メモ：答え合わせと今回への接続（3分｜16〜19分）
前回の道順1分＋構成図1分＋演習①3分＋演習②4分＋答え合わせ3分＋開発の流れ2分＝14分。
演習①・②は、それぞれ考える時間とSlack投稿を含む。両演習で同じ構成図を使う。

**演習①：A＝3、B＝2、C＝4、D＝1。**

**演習②：対応の考え方**

| 技術・サービス | 図への対応 | 前回の役割 |
| --- | --- | --- |
| Google AI Studio | 図全体を作る・改良する道具。実行時の箱には収まらない | AIに指示してアプリを生成・修正する |
| ToDoアプリ・チャットアプリ | 操作する画面はA。保存・ログインを含むアプリ全体は複数の役割にまたがる | タスク管理や会話をする |
| Cloud Firestore | Dのデータベースに対応。保存・取得の機能もサービスとして提供する | タスク・会話履歴の保存と同期 |
