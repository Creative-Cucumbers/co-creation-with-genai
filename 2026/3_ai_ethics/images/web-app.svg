<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 310" role="img" aria-labelledby="title desc"><title id="title">Webアプリのファイル配信とAPI処理</title><desc id="desc">箱と矢印でWebアプリのファイル配信とAPI処理を示す。矢印のラベルが情報や操作の意味を表す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker></defs><style>text{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:30px;fill:#242424}.label{font-size:24px;fill:#004898;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style><rect width="1440" height="310" fill="white"/><rect x="20" y="65" width="320" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M20,65H340" stroke="#004898" stroke-width="3"/><text x="180.0" y="96.0" text-anchor="middle" dominant-baseline="middle">配信サーバー</text><text x="180.0" y="130.0" text-anchor="middle" dominant-baseline="middle">HTML・CSS・JSなど</text><text x="180.0" y="164.0" text-anchor="middle" dominant-baseline="middle">用意済みのファイル</text><rect x="435" y="65" width="280" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M435,65H715" stroke="#004898" stroke-width="3"/><text x="575.0" y="113.0" text-anchor="middle" dominant-baseline="middle">ブラウザ</text><text x="575.0" y="147.0" text-anchor="middle" dominant-baseline="middle">表示・実行</text><rect x="815" y="65" width="280" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M815,65H1095" stroke="#004898" stroke-width="3"/><text x="955.0" y="113.0" text-anchor="middle" dominant-baseline="middle">処理する</text><text x="955.0" y="147.0" text-anchor="middle" dominant-baseline="middle">サーバー</text><rect x="1190" y="65" width="230" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M1190,65H1420" stroke="#004898" stroke-width="3"/><text x="1305.0" y="113.0" text-anchor="middle" dominant-baseline="middle">データベース</text><text x="1305.0" y="147.0" text-anchor="middle" dominant-baseline="middle">外部サービス</text><path d="M340,130 L435,130" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="388" y="105" text-anchor="middle">配信</text><path d="M715,90 L815,90" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="765" y="40" text-anchor="middle">APIで依頼</text><path d="M815,165 L715,165" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="765" y="225" text-anchor="middle">データ・結果</text><path d="M1095,130 L1190,130" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><text class="label" x="1150" y="40" text-anchor="middle">取得・保存</text><text class="label" x="720" y="285" text-anchor="middle">ファイルの配信と、利用時の処理・データ取得を組み合わせられる。</text></svg>
