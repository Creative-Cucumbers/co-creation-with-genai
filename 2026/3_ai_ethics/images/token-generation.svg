<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc"><title id="title">次のトークンを生成する繰り返し</title><desc id="desc">箱と矢印で次のトークンを生成する繰り返しを示す。矢印のラベルが情報や操作の意味を表す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker></defs><style>text{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:30px;fill:#242424}.label{font-size:24px;fill:#004898;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style><rect width="1440" height="360" fill="white"/><rect x="40" y="55" width="320" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M40,55H360" stroke="#004898" stroke-width="3"/><text x="200.0" y="110.0" text-anchor="middle" dominant-baseline="middle">入力・文脈</text><rect x="540" y="55" width="420" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M540,55H960" stroke="#004898" stroke-width="3"/><text x="750.0" y="93.0" text-anchor="middle" dominant-baseline="middle">次のトークンを</text><text x="750.0" y="127.0" text-anchor="middle" dominant-baseline="middle">予測・選択</text><rect x="1120" y="55" width="280" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M1120,55H1400" stroke="#004898" stroke-width="3"/><text x="1260.0" y="110.0" text-anchor="middle" dominant-baseline="middle">文章に追加</text><path d="M360,110 L540,110" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M960,110 L1120,110" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1260,165 L1260,290 L750,290 L750,165" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="1005" y="270" text-anchor="middle">追加後の文脈で繰り返す</text></svg>
