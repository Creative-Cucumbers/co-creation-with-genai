<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 330" role="img" aria-labelledby="title desc"><title id="title">検索・資料とLLMを組み合わせた回答</title><desc id="desc">箱と矢印で検索・資料とLLMを組み合わせた回答を示す。矢印のラベルが情報や操作の意味を表す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker></defs><style>text{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:30px;fill:#242424}.label{font-size:24px;fill:#004898;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style><rect width="1440" height="330" fill="white"/><rect x="20" y="70" width="220" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M20,70H240" stroke="#004898" stroke-width="3"/><text x="130.0" y="135.0" text-anchor="middle" dominant-baseline="middle">質問</text><rect x="330" y="70" width="280" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M330,70H610" stroke="#004898" stroke-width="3"/><text x="470.0" y="118.0" text-anchor="middle" dominant-baseline="middle">検索・資料</text><text x="470.0" y="152.0" text-anchor="middle" dominant-baseline="middle">を取得</text><rect x="710" y="70" width="350" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M710,70H1060" stroke="#004898" stroke-width="3"/><text x="885.0" y="118.0" text-anchor="middle" dominant-baseline="middle">質問＋取得した情報</text><text x="885.0" y="152.0" text-anchor="middle" dominant-baseline="middle">をLLMに渡す</text><rect x="1160" y="70" width="260" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M1160,70H1420" stroke="#004898" stroke-width="3"/><text x="1290.0" y="118.0" text-anchor="middle" dominant-baseline="middle">出典付きの</text><text x="1290.0" y="152.0" text-anchor="middle" dominant-baseline="middle">回答</text><path d="M240,135 L330,135" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M610,135 L710,135" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1060,135 L1160,135" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="720" y="290" text-anchor="middle">検索や資料を組み合わせても、重要な内容は元の資料を確認する。</text></svg>
