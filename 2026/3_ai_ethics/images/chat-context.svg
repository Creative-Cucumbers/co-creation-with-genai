<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc"><title id="title">チャットでLLMに渡す情報</title><desc id="desc">箱と矢印でチャットでLLMに渡す情報を示す。矢印のラベルが情報や操作の意味を表す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker></defs><style>text{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:30px;fill:#242424}.label{font-size:24px;fill:#004898;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style><rect width="1440" height="520" fill="white"/><rect x="25" y="35" width="330" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M25,35H355" stroke="#004898" stroke-width="3"/><text x="190.0" y="73.0" text-anchor="middle" dominant-baseline="middle">システムプロンプト</text><text x="190.0" y="107.0" text-anchor="middle" dominant-baseline="middle">役割・答え方</text><rect x="25" y="205" width="330" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M25,205H355" stroke="#004898" stroke-width="3"/><text x="190.0" y="243.0" text-anchor="middle" dominant-baseline="middle">会話履歴</text><text x="190.0" y="277.0" text-anchor="middle" dominant-baseline="middle">これまでのやり取り</text><rect x="25" y="375" width="330" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M25,375H355" stroke="#004898" stroke-width="3"/><text x="190.0" y="430.0" text-anchor="middle" dominant-baseline="middle">今回のユーザー入力</text><rect x="525" y="200" width="330" height="130" fill="#f2f3f4" stroke="#d9dde2"/><path d="M525,200H855" stroke="#004898" stroke-width="3"/><text x="690.0" y="248.0" text-anchor="middle" dominant-baseline="middle">アプリが入力を</text><text x="690.0" y="282.0" text-anchor="middle" dominant-baseline="middle">組み立てる</text><rect x="1000" y="210" width="170" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M1000,210H1170" stroke="#004898" stroke-width="3"/><text x="1085.0" y="265.0" text-anchor="middle" dominant-baseline="middle">LLM</text><rect x="1250" y="210" width="170" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M1250,210H1420" stroke="#004898" stroke-width="3"/><text x="1335.0" y="265.0" text-anchor="middle" dominant-baseline="middle">回答</text><path d="M355,90 L440,90 L440,265 L525,265" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M355,260 L440,260 L440,265 L525,265" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M355,430 L440,430 L440,265 L525,265" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M855,265 L1000,265" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="925" y="230" text-anchor="middle">指示・会話</text><path d="M1170,265 L1250,265" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="720" y="500" text-anchor="middle">役割を区別して渡す構成もある。どこまで履歴を渡すかはアプリの実装による。</text></svg>
