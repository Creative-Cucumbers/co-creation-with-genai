<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc"><title id="title">AIアプリの情報の通り道</title><desc id="desc">箱と矢印でAIアプリの情報の通り道を示す。矢印のラベルが情報や操作の意味を表す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker></defs><style>text{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:30px;fill:#242424}.label{font-size:24px;fill:#004898;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style><rect width="1440" height="520" fill="white"/><rect x="20" y="270" width="170" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M20,270H190" stroke="#004898" stroke-width="3"/><text x="105.0" y="325.0" text-anchor="middle" dominant-baseline="middle">使う人</text><rect x="280" y="270" width="290" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M280,270H570" stroke="#004898" stroke-width="3"/><text x="425.0" y="308.0" text-anchor="middle" dominant-baseline="middle">ブラウザ</text><text x="425.0" y="342.0" text-anchor="middle" dominant-baseline="middle">画面・入力</text><rect x="720" y="270" width="280" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M720,270H1000" stroke="#004898" stroke-width="3"/><text x="860.0" y="308.0" text-anchor="middle" dominant-baseline="middle">アプリの</text><text x="860.0" y="342.0" text-anchor="middle" dominant-baseline="middle">サーバー</text><rect x="1140" y="270" width="280" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M1140,270H1420" stroke="#004898" stroke-width="3"/><text x="1280.0" y="308.0" text-anchor="middle" dominant-baseline="middle">AIサービス</text><text x="1280.0" y="342.0" text-anchor="middle" dominant-baseline="middle">モデルで推論</text><rect x="620" y="35" width="460" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M620,35H1080" stroke="#004898" stroke-width="3"/><text x="850.0" y="68.0" text-anchor="middle" dominant-baseline="middle">作る人が設定した</text><text x="850.0" y="102.0" text-anchor="middle" dominant-baseline="middle">システムプロンプト</text><path d="M190,325 L280,325" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570,290 L720,290" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="645" y="250" text-anchor="middle">メッセージ</text><path d="M720,355 L570,355" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="645" y="415" text-anchor="middle">表示する内容</text><path d="M1000,290 L1140,290" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="1070" y="240" text-anchor="middle">指示・会話</text><text class="label" x="1070" y="267" text-anchor="middle">必要なデータ</text><path d="M1140,355 L1000,355" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="1070" y="415" text-anchor="middle">応答</text><path d="M850,135 L850,270" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="720" y="490" text-anchor="middle">代表的な構成。自分のアプリの実装は、コードや公式説明で確かめる。</text></svg>
