<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc"><title id="title">学習と回答生成の流れ</title><desc id="desc">箱と矢印で学習と回答生成の流れを示す。矢印のラベルが情報や操作の意味を表す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker></defs><style>text{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:30px;fill:#242424}.label{font-size:24px;fill:#004898;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style><rect width="1440" height="520" fill="white"/><rect x="60" y="65" width="290" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M60,65H350" stroke="#004898" stroke-width="3"/><text x="205.0" y="115.0" text-anchor="middle" dominant-baseline="middle">学習用のデータ</text><rect x="520" y="65" width="400" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M520,65H920" stroke="#004898" stroke-width="3"/><text x="720.0" y="81.0" text-anchor="middle" dominant-baseline="middle">学習</text><text x="720.0" y="115.0" text-anchor="middle" dominant-baseline="middle">パターンを学ぶ</text><text x="720.0" y="149.0" text-anchor="middle" dominant-baseline="middle">モデルの重みを調整</text><rect x="1100" y="65" width="280" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M1100,65H1380" stroke="#004898" stroke-width="3"/><text x="1240.0" y="115.0" text-anchor="middle" dominant-baseline="middle">学習済みモデル</text><rect x="60" y="305" width="290" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M60,305H350" stroke="#004898" stroke-width="3"/><text x="205.0" y="338.0" text-anchor="middle" dominant-baseline="middle">利用時の入力</text><text x="205.0" y="372.0" text-anchor="middle" dominant-baseline="middle">指示・会話など</text><rect x="520" y="305" width="400" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M520,305H920" stroke="#004898" stroke-width="3"/><text x="720.0" y="338.0" text-anchor="middle" dominant-baseline="middle">推論</text><text x="720.0" y="372.0" text-anchor="middle" dominant-baseline="middle">モデルで出力を生成</text><rect x="1100" y="305" width="280" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M1100,305H1380" stroke="#004898" stroke-width="3"/><text x="1240.0" y="355.0" text-anchor="middle" dominant-baseline="middle">回答</text><path d="M350,115 L520,115" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M920,115 L1100,115" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M350,355 L520,355" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M920,355 L1100,355" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1240,165 L1240,235 L720,235 L720,305" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="980" y="222" text-anchor="middle">モデルを使う</text><path d="M150,305 L150,165" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 7"/><path d="M1240,405 L1240,450 L25,450 L25,115 L60,115" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 7"/><text class="label" x="720" y="490" text-anchor="middle">点線：入力・回答を、規約・設定によっては後から改善・学習に利用（常に起こるわけではない）</text></svg>
