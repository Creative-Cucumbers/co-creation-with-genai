<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc"><title id="title">AIエージェントの実行・確認・繰り返し</title><desc id="desc">箱と矢印でAIエージェントの実行・確認・繰り返しを示す。矢印のラベルが情報や操作の意味を表す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#004898"/></marker></defs><style>text{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:30px;fill:#242424}.label{font-size:24px;fill:#004898;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style><rect width="1440" height="600" fill="white"/><rect x="30" y="40" width="250" height="90" fill="#f2f3f4" stroke="#d9dde2"/><path d="M30,40H280" stroke="#004898" stroke-width="3"/><text x="155.0" y="68.0" text-anchor="middle" dominant-baseline="middle">利用者</text><text x="155.0" y="102.0" text-anchor="middle" dominant-baseline="middle">京都観光を計画</text><rect x="380" y="40" width="280" height="90" fill="#f2f3f4" stroke="#d9dde2"/><path d="M380,40H660" stroke="#004898" stroke-width="3"/><text x="520.0" y="68.0" text-anchor="middle" dominant-baseline="middle">AIモデル</text><text x="520.0" y="102.0" text-anchor="middle" dominant-baseline="middle">次の行動を選ぶ</text><rect x="790" y="40" width="380" height="110" fill="#f2f3f4" stroke="#d9dde2"/><path d="M790,40H1170" stroke="#004898" stroke-width="3"/><text x="980.0" y="78.0" text-anchor="middle" dominant-baseline="middle">アプリ</text><text x="980.0" y="112.0" text-anchor="middle" dominant-baseline="middle">権限・入力・人の承認を確認</text><rect x="790" y="260" width="380" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M790,260H1170" stroke="#004898" stroke-width="3"/><text x="980.0" y="293.0" text-anchor="middle" dominant-baseline="middle">ツールを実行</text><text x="980.0" y="327.0" text-anchor="middle" dominant-baseline="middle">検索・予約など</text><rect x="380" y="260" width="280" height="100" fill="#f2f3f4" stroke="#d9dde2"/><path d="M380,260H660" stroke="#004898" stroke-width="3"/><text x="520.0" y="276.0" text-anchor="middle" dominant-baseline="middle">実行結果</text><text x="520.0" y="310.0" text-anchor="middle" dominant-baseline="middle">営業時間</text><text x="520.0" y="344.0" text-anchor="middle" dominant-baseline="middle">予約の成否など</text><rect x="790" y="470" width="380" height="90" fill="#f2f3f4" stroke="#d9dde2"/><path d="M790,470H1170" stroke="#004898" stroke-width="3"/><text x="980.0" y="498.0" text-anchor="middle" dominant-baseline="middle">実行せず</text><text x="980.0" y="532.0" text-anchor="middle" dominant-baseline="middle">利用者に確認・案内</text><rect x="30" y="470" width="350" height="90" fill="#f2f3f4" stroke="#d9dde2"/><path d="M30,470H380" stroke="#004898" stroke-width="3"/><text x="205.0" y="515.0" text-anchor="middle" dominant-baseline="middle">利用者に結果を伝える</text><path d="M280,85 L380,85" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660,85 L790,85" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="725" y="30" text-anchor="middle">ツールを提案</text><path d="M980,150 L980,260" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="1100" y="215" text-anchor="middle">許可された操作</text><path d="M790,310 L660,310" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520,260 L520,130" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="650" y="205" text-anchor="middle">結果を文脈に追加</text><path d="M1170,95 L1370,95 L1370,515 L1170,515" fill="none" stroke="#004898" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="1260" y="445" text-anchor="middle">許可されない操作</text><path d="M380,85 L320,85 L320,420 L205,420 