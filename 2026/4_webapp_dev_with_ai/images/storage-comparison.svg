<text x="28" y="38" font-size="27" font-weight="700">localStorage：保存場所は別々</text>
<g transform="translate(100 72)"><g stroke="#004898" stroke-width="4" fill="#edf3f9"><rect x="0" y="0" width="128" height="84" rx="4"/><path d="M0 84L-14 100H142L128 84Z"/></g></g><g transform="translate(471 65)"><g stroke="#004898" stroke-width="4" fill="#edf3f9"><rect x="0" y="0" width="58" height="106" rx="6"/><path d="M18 92H40"/></g></g>
