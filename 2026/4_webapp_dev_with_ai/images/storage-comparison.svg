<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 260" role="img" aria-labelledby="title"><title id="title">localStorageは各ブラウザ内、Firestoreは端末共通のクラウドに保存する</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#004898"/></marker></defs><g font-family="Arial,Hiragino Kaku Gothic ProN,Yu Gothic,Meiryo,sans-serif" fill="#242424">
