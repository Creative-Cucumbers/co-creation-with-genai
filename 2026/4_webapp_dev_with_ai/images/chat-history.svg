<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title"><title id="title">ログインした人の発言とAIの返答を会話ごとに保存し、再ログインして読み出す</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#004898"/></marker></defs><g font-family="Arial,Hiragino Kaku Gothic ProN,Yu Gothic,Meiryo,sans-serif" fill="#242424"><rect x="8" y="15" width="350" height="210" fill="#f2f3f4"/><text x="35" y="53" font-size="25" font-weight="700">Googleログインした人</text><g stroke="#004898" stroke-width="2" fill="#edf3f9"><path d="M43 78H315V123H75L57 140V123H43Z"/><path d="M43 152H315V197H290L307 214V197H43Z"/></g><text x="63" y="109" font-size="22">自分の発言</text><text x="63" y="183" font-size="22">AIの返答</text><path d="M380 120H462M734 120H823" stroke="#004898" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="483" y="42" width="230" height="162" fill="#edf3f9" stroke="#004898" stroke-width="2"/><text x="510" y="82" font-size="25" font-weight="700">Firestore</text><text x="510" y="122" font-size="22">会話ID・持ち主</text><text x="510" y="164" font-size="22">発言・送信日時</text><rect x="848" y="15" width="342" height="210" fill="#f2f3f4"/><text x="875" y="59" font-size="25" font-weight="700">もう一度ログイン</text><text x="875" y="106" font-size="22">自分の会話一覧を開く</text><text x="875" y="148" font-size="22">過去の会話を読み出す</text><text x="875" y="190" font-size="22">続きを話す</text></g></svg>